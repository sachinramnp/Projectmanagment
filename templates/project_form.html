{% extends 'base.html' %}{% block content %}<header class="topbar"><div><small class="eyebrow">WORKSPACE</small><h2>Create a project</h2><p class="text-muted">Set up a shared space for your work.</p></div></header><div class="form-card"><form method="post">{% csrf_token %}<label>Project name</label><input class="form-control mb-3" name="name" maxlength="160" required placeholder="e.g. Semester project"><label>Description</label><textarea class="form-control mb-3" rows="4" name="description" placeholder="What is this project about?"></textarea><div class="row"><div class="col-md-6"><label>Status</label><select class="form-select mb-3" name="status"><option value="active">Active</option><option value="planning">Planning</option><option value="hold">On Hold</option></select></div><div class="col-md-6"><label>Priority</label><select class="form-select mb-3" name="priority"><option value="medium">Medium</option><option value="low">Low</option><option value="high">High</option><option value="urgent">Urgent</option></select></div></div><label>Due date</label><input class="form-control mb-4" type="date" name="due_date"><button class="btn btn-primary">Create project</button> <a class="btn btn-light" href="/projects/">Cancel</a></form></div>{% endblock %}

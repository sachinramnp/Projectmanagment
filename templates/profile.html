{% extends 'base.html' %}{% block content %}<header class="topbar"><div><small class="eyebrow">ACCOUNT</small><h2>Your profile</h2></div></header><div class="form-card"><form method="post" enctype="multipart/form-data">{% csrf_token %}<label>Full name</label><input class="form-control mb-3" name="full_name" value="{{ profile.full_name }}"><label>Email</label><input class="form-control mb-3" type="email" name="email" value="{{ user.email }}"><label>Profile picture</label><input class="form-control mb-3" type="file" name="picture" accept="image/*"><p class="text-muted small">Role: {{ profile.get_role_display }}</p><button class="btn btn-primary">Save profile</button></form></div>{% endblock %}
